name: Build and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AutoMouseClicker.sln

      - name: Build
        run: dotnet build AutoMouseClicker.sln --configuration Release --no-restore

      - name: Read release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "VERSION must contain a MAJOR.MINOR.PATCH value, such as 1.0.1."
          }

          $candidateVersion = [version]::Parse($version)
          $tagOutput = @(git tag --list 'v*' 2>&1)
          $gitExitCode = $LASTEXITCODE
          if ($gitExitCode -ne 0) {
            throw "Failed to read existing version tags (git exit code $gitExitCode): $($tagOutput -join ' ')"
          }
          $latestTag = $tagOutput |
            Where-Object { $_ -match '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' } |
            Sort-Object { [version]::Parse($_.Substring(1)) } -Descending |
            Select-Object -First 1

          $shouldRelease = $true
          if ($latestTag) {
            $latestVersion = [version]::Parse($latestTag.Substring(1))
            if ($candidateVersion -lt $latestVersion) {
              throw "VERSION ($version) is lower than the latest release ($latestTag)."
            }
            if ($candidateVersion -eq $latestVersion) {
              $shouldRelease = $false
              Write-Host "::notice::VERSION $version is already released; skipping the stable release and WinGet update."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish standalone executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_VERSION: ${{ steps.release_version.outputs.version }}
        run: dotnet publish AutoMouseClicker/AutoMouseClicker.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=$env:APP_VERSION

      - name: Create SHA-256 checksum and WinGet manifest
        if: steps.release_version.outputs.should_release == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $tagName = "v$version"
          $assetPath = "publish/AutoMouseClicker.exe"
          $checksumPath = "$assetPath.sha256"
          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AutoMouseClicker.exe" | Set-Content -Path $checksumPath -Encoding ascii

          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tagName/AutoMouseClicker.exe"
          $manifestPath = "publish/EdenBeavis.AutoMouseClicker.yaml"
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.singleton.1.12.0.schema.json
          PackageIdentifier: EdenBeavis.AutoMouseClicker
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: EdenBeavis
          PublisherUrl: https://github.com/EdenBeavis
          PackageName: AutoMouseClicker
          PackageUrl: https://edenbeavis.github.io/AutoMouseClicker/
          License: MIT
          LicenseUrl: https://github.com/EdenBeavis/AutoMouseClicker/blob/main/LICENSE
          ShortDescription: Windows auto clicker with fixed or randomized intervals and a global hotkey.
          Tags:
            - auto-clicker
            - mouse-automation
            - windows
          Installers:
            - Architecture: x64
              InstallerType: portable
              InstallerUrl: $installerUrl
              InstallerSha256: $hash
              Commands:
                - AutoMouseClicker
          ManifestType: singleton
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path $manifestPath -Encoding utf8

      - name: Create or update rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = "rolling"
          $assetPath = "publish/AutoMouseClicker.exe"
          $releaseNotes = "Automatically updated from the latest commit on main. This rolling release is not a versioned snapshot."

          gh release view $tagName --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tagName" --method PATCH --field sha="$env:GITHUB_SHA" --field force=true
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the rolling release tag."
            }

            gh release edit $tagName --title "Latest main build" --notes $releaseNotes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the rolling release details."
            }

            gh release upload $tagName $assetPath --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload the latest executable."
            }
          } else {
            gh release create $tagName $assetPath --title "Latest main build" --notes $releaseNotes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the rolling release."
            }
          }

      - name: Create immutable versioned release
        if: steps.release_version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $tagName = "v$version"
          gh release create $tagName `
            "publish/AutoMouseClicker.exe" `
            "publish/AutoMouseClicker.exe.sha256" `
            "publish/EdenBeavis.AutoMouseClicker.yaml" `
            --title "AutoMouseClicker $version" `
            --target $env:GITHUB_SHA `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the versioned release. Do not reuse or move an existing version tag."
          }

      - name: Submit WinGet update
        if: steps.release_version.outputs.should_release == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            Write-Host "::notice::WinGet update skipped. Add the WINGET_CREATE_GITHUB_TOKEN repository secret after the initial package is accepted."
            exit 0
          }

          winget install --id Microsoft.WingetCreate --exact --source winget --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install WinGetCreate."
          }

          $version = $env:APP_VERSION
          $tagName = "v$version"
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tagName/AutoMouseClicker.exe"
          wingetcreate update `
            --urls $installerUrl `
            --version $version `
            --prtitle "New version: EdenBeavis.AutoMouseClicker $version" `
            --submit `
            EdenBeavis.AutoMouseClicker
          if ($LASTEXITCODE -ne 0) {
            throw "WinGetCreate failed to submit the package update."
          }